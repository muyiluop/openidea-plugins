id = "muyiluop.jvm-default-parameters"
name = "JVM Default Parameters"
version = "0.4.0"
description = "Appends your JVM options and program arguments to every launch configuration of the project: it saves the Spring Boot / Application configurations the IDE detects by itself into .openidea/run.toml (VM options included) and patches .idea/workspace.xml, .run/*.run.xml and .vscode/launch.json, so a multi-module or micro-service workspace is configured once instead of per configuration."
authors = ["muyiluop"]
license = "MIT"
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"

activation = [
    "on-command:jvm-params.apply-run-files",
    "on-command:jvm-params.preview",
]

[capabilities]
# `project.read` reads the run-configuration files that are patched.
# `project.write` is optional and is what makes patching possible at all: the IDE
# asks for it once, in Settings › Plugins, and without it the plugin can only
# report what it would have written.
required = ["project.read"]
optional = ["project.write"]

[contributes.settings]
title = "JVM Default Parameters"
schema = "settings.schema.json"

[[contributes.commands]]
id = "jvm-params.apply-run-files"
title = "JVM Parameters: Apply to All Launch Configurations"
category = "JVM Parameters"

[[contributes.commands]]
id = "jvm-params.preview"
title = "JVM Parameters: Preview"
category = "JVM Parameters"
