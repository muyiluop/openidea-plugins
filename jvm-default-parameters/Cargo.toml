[package]
name = "openidea-plugin-jvm-params"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "JVM Default Parameters: injects JVM options and program arguments into OpenIDEA launch configurations"
license = "MIT"
repository = "https://github.com/muyiluop/openidea-plugins"

# A plugin is its own workspace: keep it out of any parent one.
[workspace]
# The core crate is a workspace of its own on purpose: it has no SDK dependency,
# so `cd crates/jvm-params-core && cargo test --offline` works without cloning the
# SDK or having network access.
exclude = ["crates/jvm-params-core"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Contributed run configurations (`register_plugin!(…, run_configurations)`).
# Needs plugin API 1.4: the released SDK (tag `v0.1.39`, what the shipped IDE
# reports as "plugin API 1.3.0") has no `wit/run.wit`, so this only compiles
# against a newer commit — e.g.
#   openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", rev = "4bc08a1…" }
# Enabling it also needs `[[contributes.runConfigurations]]` in `plugin.toml` and
# `engines.openidea = "^1.4"`; the default 1.3 build keeps everything else
# working (preview, patching run configuration files, running in a terminal).
api14 = []

[dependencies]
# The SDK to build against. `v0.1.39` is the newest release and the one matching
# the shipped IDE's plugin API 1.3.0 — see `plugin.toml`'s
# `engines.openidea = "^1.3"`.
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.39" }
jvm-params-core = { path = "crates/jvm-params-core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
