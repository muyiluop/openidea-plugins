id = "muyiluop.jvm-default-parameters"
name = "JVM Default Parameters"
version = "0.1.0"
description = "Injects JVM options and program arguments into launch configurations: contributes Spring Boot run configurations built from your settings, and a command that patches the .run/*.xml, .idea/runConfigurations/*.xml and .vscode/launch.json files the IDE already reads."
authors = ["muyiluop"]
license = "MIT"
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"

# `on-startup-finished` keeps the instance alive so the contributed run
# configurations are available the first time the Run dialog is opened; the
# commands also activate the plugin on their own.
activation = [
    "on-startup-finished",
    "on-command:jvm-params.preview",
    "on-command:jvm-params.apply-run-files",
]

[capabilities]
# `project.read` scans build files, wrappers and jars and reads run
# configuration files. A contributed configuration is matched against an approved
# program by the exact `program` string in the record, so every token the planner
# can emit is declared here; the IDE pins the real file per project the first time
# you approve it in Settings › Plugins.
required = [
    "project.read",
    "process:java",
    "process:mvnw",
    "process:mvnw.cmd",
    "process:gradlew",
    "process:gradlew.bat",
    "process:mvn",
    "process:gradle",
]
# Only the "apply to run configuration files" command writes.
optional = ["project.write"]

# The marker files that make a project interesting. Literal relative paths at the
# project root, one to sixteen of them; the provider is only called for a trusted
# project that contains at least one.
[[contributes.runConfigurations]]
files = ["pom.xml", "build.gradle", "build.gradle.kts"]

[contributes.settings]
title = "JVM Default Parameters"
schema = "settings.schema.json"

[[contributes.commands]]
id = "jvm-params.preview"
title = "JVM Default Parameters: Preview Generated Configurations"
category = "JVM Parameters"

[[contributes.commands]]
id = "jvm-params.apply-run-files"
title = "JVM Default Parameters: Apply Parameters to Run Configuration Files"
category = "JVM Parameters"
