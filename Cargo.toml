[package]
name = "openidea-plugin-jvm-params"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "JVM Default Parameters: injects JVM options and program arguments into OpenIDEA launch configurations"
license = "MIT"
repository = "https://github.com/muyiluop/openidea-plugins"

# A plugin is its own workspace: keep it out of any parent one.
[workspace]
# The core crate is a workspace of its own on purpose: it has no SDK dependency,
# so `cd crates/jvm-params-core && cargo test --offline` works without cloning the
# SDK or having network access.
exclude = ["crates/jvm-params-core"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK to build against. Pinned to a commit: no release tag carries the
# run-configuration API yet (`v0.1.39` still exports only API 1.3 and has no
# `wit/run.wit`, so `register_plugin!(…, run_configurations)` does not compile
# against it). Bump `rev` to a newer commit, or to a released `tag`, once one
# ships this API — see `plugin.toml`'s `engines.openidea = "^1.4"`.
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", rev = "4bc08a1084701f1e6a07f1e54ab07ed83019a74d" }
jvm-params-core = { path = "crates/jvm-params-core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
